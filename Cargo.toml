[package]
name = "segzify"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "BSD-3-Clause"
description = "Convert Japanese prose to segzi and seg-kanazukahi"
repository = "https://github.com/c4se-jp/segzi-tools"

[[bin]]
name = "segzify"
path = "src/main.rs"

[dependencies]
lindera = { version = "6.0.0", default-features = false, features = ["embed-unidic"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
